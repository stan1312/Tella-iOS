# SPECTRE Capture Android CI.
#  core: spectre-core unit + end-to-end scenarios (real Apps Script code on the Node mock stack), backend tests.
#  apk:  builds the "spectre" flavor. Signed release APK when the owner has stored the signing key in the
#        repository secrets (SPECTRE_KEYSTORE_B64, SPECTRE_KEYSTORE_PASSWORD); otherwise a debug-signed test APK.
#        No Google identifier, /exec URL or invitation is ever compiled into the APK.
name: spectre-android
on:
  push:
    paths: ['android/**', 'backend/**', 'scripts/android_*', '.github/workflows/spectre-android.yml']
  pull_request:
    paths: ['android/**', 'backend/**', 'scripts/android_*', '.github/workflows/spectre-android.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: spectre-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: ffmpeg (synthetic fixtures + audio checks)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Backend tests (Apps Script on simulated Drive)
        run: cd backend && npm test
      - name: Synthetic fixtures
        run: ./scripts/android_make_fixtures.sh
      - name: spectre-core tests (unit + T01–T15)
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon -p spectre-core test
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t=f=s=0
          for x in glob.glob('android/spectre-core/build/test-results/test/*.xml'):
              r=ET.parse(x).getroot(); t+=int(r.get('tests')); f+=int(r.get('failures'))+int(r.get('errors')); s+=int(r.get('skipped'))
          print(f"### spectre-core: {t} tests, {f} failed, {s} skipped")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: spectre-core-test-results, path: android/spectre-core/build/test-results/test/ }

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SPECTRE_VERSION_CODE: ${{ github.run_number }}
      SPECTRE_APPLICATION_ID: ${{ vars.SPECTRE_APPLICATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.12916984" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (owner secret, optional)
        env:
          KEYSTORE_B64: ${{ secrets.SPECTRE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/spectre.p12"
            echo "SPECTRE_KEYSTORE=$RUNNER_TEMP/spectre.p12" >> "$GITHUB_ENV"
            echo "VARIANT=Release" >> "$GITHUB_ENV"
          else
            echo "::warning::No SPECTRE_KEYSTORE_B64 secret: building a debug-signed TEST APK (see docs/ANDROID_APK.md)."
            echo "VARIANT=Debug" >> "$GITHUB_ENV"
          fi
      - name: Build APK (flavor spectre)
        env:
          SPECTRE_KEYSTORE_PASSWORD: ${{ secrets.SPECTRE_KEYSTORE_PASSWORD }}
          SPECTRE_KEY_ALIAS: ${{ secrets.SPECTRE_KEY_ALIAS }}
        run: |
          cd android && chmod +x gradlew
          ./gradlew --no-daemon -Pfdroid -Pkotlin.compiler.execution.strategy=in-process \
            "-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8" \
            ":mobile:assembleSpectre${VARIANT}"
      - name: Verify APK (signature, no secrets inside)
        run: |
          APK=$(ls android/mobile/build/outputs/apk/spectre/*/*.apk | head -1)
          echo "APK=$APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --print-certs "$APK" | tee signing.txt
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|application-label:|sdkVersion|targetSdkVersion" | tee badging.txt
          if unzip -p "$APK" | grep -a -E -q "script\.google\.com/macros/s/[A-Za-z0-9_-]{20,}"; then echo "::error::an Apps Script /exec URL is embedded"; exit 1; fi
          if unzip -l "$APK" | grep -E -q "\.(p12|jks|keystore)$"; then echo "::error::a keystore is embedded"; exit 1; fi
          NAME="spectre-capture-android-${VARIANT,,}-${{ github.run_number }}.apk"
          mkdir -p out && cp "$APK" "out/$NAME" && (cd out && sha256sum "$NAME" | tee "$NAME.sha256")
          {
            echo "### APK ${VARIANT}: \`$NAME\`"
            echo '```'; cat badging.txt; grep -E "Signer #1 certificate (DN|SHA-256)" signing.txt; cat out/*.sha256; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: spectre-capture-android-${{ github.run_number }}
          path: out/
          retention-days: 30
